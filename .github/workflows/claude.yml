# @claude on issues and pull requests.
#
# Who can start it: only the repository owner, org members and invited
# collaborators. The job-level `if` checks author_association before any step
# runs, so the token secret is never handed to a run started by anyone else.
# Every trigger is one where the event's author is the actor who caused it
# (new comments, reviews and issues; no `assigned`, whose author is not the
# assigner). Reviews count only on pull requests from this repository: fork
# review events get no secrets, so they could only fail.
# The action also requires write access, and it rejects bot actors because
# allowed_bots is left empty, so other review bots (Codex, CodeRabbit) can talk
# on a PR without starting a Claude run, and nothing can trigger itself in a loop.
#
# Pins: actions by full commit SHA. claude-code-action v1.0.260 is the first
# release that checks out the PR commit the comment was made on and skips the
# run if the branch moved afterwards (PR #1915).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# The workflow token only reads. The action writes with its own GitHub App
# token, which it obtains through OIDC (id-token: write).
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      || (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
